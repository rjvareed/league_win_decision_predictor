[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolwp"
version = "0.1.0"
description = "League of Legends win probability from the champion draft alone (Diamond+ solo queue, latest patch)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lolwp-collect = "lolwp.collect:main"
lolwp-train = "lolwp.train:main"
lolwp-predict = "lolwp.predict:main"
lolwp-draft = "lolwp.draft:main"
lolwp-tune = "lolwp.tune:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
